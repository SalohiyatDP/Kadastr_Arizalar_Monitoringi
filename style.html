<style>
/* ============================================================
   style.html - CSS stillari
   Davlat kadastrlari palatasi - Arizalar nazorati tizimi
   Zamonaviy davlat axborot tizimi dizayni
   ============================================================ */

/* === ROOT O'ZGARUVCHILAR === */
:root {
  --primary: #1a237e;
  --primary-light: #3949ab;
  --primary-dark: #0d1b5e;
  --secondary: #0288d1;
  --success: #28a745;
  --warning: #ffc107;
  --danger: #dc3545;
  --danger-dark: #721c24;
  --info: #007bff;
  --orange: #fd7e14;
  --gray: #6c757d;
  --light-bg: #f4f6f9;
  --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  --card-hover-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
  --border-radius: 12px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === UMUMIY === */
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', 'Roboto', sans-serif;
  background: var(--light-bg);
  color: #333;
  min-height: 100vh;
  margin: 0;
  padding: 0;
}

/* === HEADER === */
.app-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  padding: 1rem 2rem;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.app-header h1 {
  font-size: 1.4rem;
  margin: 0;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.app-header .subtitle {
  font-size: 0.85rem;
  opacity: 0.85;
  margin-top: 2px;
}

.header-logo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
}

/* === MAIN CONTAINER === */
.main-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* === KARTOCHKALAR === */
.stat-card {
  background: #fff;
  border-radius: var(--border-radius);
  padding: 1.25rem;
  box-shadow: var(--card-shadow);
  transition: var(--transition);
  border-left: 4px solid var(--primary);
  position: relative;
  overflow: hidden;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-hover-shadow);
}

.stat-card .stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0.5rem 0;
}

.stat-card .stat-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--gray);
  font-weight: 600;
}

.stat-card .stat-icon {
  position: absolute;
  top: 1rem;
  right: 1rem;
  font-size: 2rem;
  opacity: 0.15;
}

/* Kartochka ranglari */
.stat-card.card-jarayonda { border-left-color: var(--info); }
.stat-card.card-jarayonda .stat-value { color: var(--info); }

.stat-card.card-yakunlangan { border-left-color: var(--success); }
.stat-card.card-yakunlangan .stat-value { color: var(--success); }

.stat-card.card-rad { border-left-color: var(--gray); }
.stat-card.card-rad .stat-value { color: var(--gray); }

.stat-card.card-bugun { border-left-color: var(--danger); }
.stat-card.card-bugun .stat-value { color: var(--danger); }

.stat-card.card-otgan { border-left-color: var(--danger-dark); }
.stat-card.card-otgan .stat-value { color: var(--danger-dark); }

.stat-card.card-kun1 { border-left-color: var(--orange); }
.stat-card.card-kun1 .stat-value { color: var(--orange); }

.stat-card.card-kun2 { border-left-color: var(--warning); }
.stat-card.card-kun2 .stat-value { color: var(--warning); }

.stat-card.card-kun3 { border-left-color: var(--info); }
.stat-card.card-kun3 .stat-value { color: var(--info); }

.stat-card.card-kun4 { border-left-color: var(--success); }
.stat-card.card-kun4 .stat-value { color: var(--success); }

/* === JADVAL === */
.table-container {
  background: #fff;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  margin-top: 1.5rem;
}

.table-container .table-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  padding: 1rem 1.5rem;
  font-weight: 600;
  font-size: 1rem;
}

.table-responsive {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.data-table thead th {
  background: #f8f9fa;
  border-bottom: 2px solid #dee2e6;
  padding: 0.75rem;
  text-align: left;
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: #555;
  white-space: nowrap;
}

.data-table tbody td {
  padding: 0.7rem 0.75rem;
  border-bottom: 1px solid #eee;
  vertical-align: middle;
}

.data-table tbody tr:hover {
  background: #f8f9ff;
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

/* === HOLAT BADGE === */
.badge-holat {
  padding: 0.35rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  display: inline-block;
}

.badge-jarayonda {
  background: #e3f2fd;
  color: #1565c0;
}

.badge-yakunlangan {
  background: #e8f5e9;
  color: #2e7d32;
}

.badge-rad {
  background: #f5f5f5;
  color: #616161;
}

/* === QOLGAN KUN BADGE === */
.badge-kun {
  padding: 0.3rem 0.6rem;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  display: inline-block;
  min-width: 35px;
  text-align: center;
}

.badge-kun-4plus { background: #e8f5e9; color: #2e7d32; }
.badge-kun-3 { background: #e3f2fd; color: #1565c0; }
.badge-kun-2 { background: #fff8e1; color: #f57f17; }
.badge-kun-1 { background: #fff3e0; color: #e65100; }
.badge-kun-0 { background: #ffebee; color: #c62828; }
.badge-kun-otgan { background: #fce4ec; color: #880e4f; font-weight: 800; }

/* Muddati bugun - satr fonini och qizil qilish */
.row-bugun-tugaydi {
  background: #fff0f0 !important;
}
.row-bugun-tugaydi:hover {
  background: #ffe5e5 !important;
}
.row-1kun {
  background: #fffbe6 !important;
}
.row-1kun:hover {
  background: #fff6cc !important;
}

/* === AMAL TUGMALARI === */
.btn-yakunlash {
  background: var(--success);
  color: #fff;
  border: none;
  padding: 0.35rem 0.7rem;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: var(--transition);
  font-weight: 600;
}

.btn-yakunlash:hover {
  background: #218838;
  transform: scale(1.05);
}

.btn-rad {
  background: var(--danger);
  color: #fff;
  border: none;
  padding: 0.35rem 0.7rem;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: var(--transition);
  font-weight: 600;
  margin-left: 0.3rem;
}

.btn-rad:hover {
  background: #c82333;
  transform: scale(1.05);
}

/* === FORMA === */
.form-section {
  background: #fff;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  padding: 1.5rem;
  margin-top: 1.5rem;
}

.form-section .section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid #e8eaf6;
}

.form-control, .form-select {
  border-radius: 8px;
  border: 1.5px solid #dee2e6;
  padding: 0.6rem 0.85rem;
  transition: var(--transition);
}

.form-control:focus, .form-select:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border: none;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  transition: var(--transition);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(26, 35, 126, 0.3);
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
}

.btn-chief {
  background: linear-gradient(135deg, #00695c 0%, #00897b 100%);
  border: none;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-weight: 600;
  color: #fff;
  transition: var(--transition);
}

.btn-chief:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0, 105, 92, 0.3);
}

/* === ANIMATSIYALAR === */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideDown {
  from {
    opacity: 0;
    max-height: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    max-height: 2000px;
    transform: translateY(0);
  }
}

.animate-fadeInUp {
  animation: fadeInUp 0.5s ease forwards;
}

.animate-fadeIn {
  animation: fadeIn 0.3s ease forwards;
}

.animate-slideDown {
  animation: slideDown 0.4s ease forwards;
}

/* Staggered animation for cards */
.stat-card:nth-child(1) { animation-delay: 0.05s; }
.stat-card:nth-child(2) { animation-delay: 0.1s; }
.stat-card:nth-child(3) { animation-delay: 0.15s; }
.stat-card:nth-child(4) { animation-delay: 0.2s; }
.stat-card:nth-child(5) { animation-delay: 0.25s; }
.stat-card:nth-child(6) { animation-delay: 0.3s; }

/* === LOADING === */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(3px);
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #e0e0e0;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.spinner-sm {
  width: 20px;
  height: 20px;
  border-width: 2px;
  display: inline-block;
  vertical-align: middle;
  margin-right: 0.5rem;
}

/* === TOAST === */
.toast-container {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 10000;
}

.custom-toast {
  min-width: 300px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  animation: fadeInUp 0.3s ease;
  border: none;
}

.toast-success {
  background: #e8f5e9;
  border-left: 4px solid var(--success);
}

.toast-error {
  background: #ffebee;
  border-left: 4px solid var(--danger);
}

.toast-warning {
  background: #fff8e1;
  border-left: 4px solid var(--warning);
}

/* === FILTRLAR === */
.filter-section {
  background: #fff;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  padding: 1.25rem;
  margin-top: 1.5rem;
}

.filter-section .form-control,
.filter-section .form-select {
  font-size: 0.85rem;
  padding: 0.5rem 0.75rem;
}

/* === MUHANDIS TANLASH === */
.engineer-select-section {
  background: #fff;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  padding: 2rem;
  text-align: center;
  max-width: 500px;
  margin: 2rem auto;
}

.engineer-select-section h3 {
  color: var(--primary);
  margin-bottom: 1.5rem;
}

.engineer-select-section .form-select {
  max-width: 350px;
  margin: 0 auto;
  font-size: 1rem;
  padding: 0.75rem;
}

/* === DIAGRAMMALAR === */
.chart-container {
  background: #fff;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  padding: 1.25rem;
  margin-top: 1.5rem;
  min-height: 350px;
}

.chart-container .chart-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #eee;
}

/* === RADIO VA CHECKBOX === */
.form-check-custom {
  padding: 0.5rem 1rem;
  background: #f8f9fa;
  border-radius: 8px;
  margin-right: 0.5rem;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  transition: var(--transition);
  border: 1.5px solid transparent;
}

.form-check-custom:hover {
  background: #e8eaf6;
}

.form-check-custom input:checked ~ .form-check-label {
  color: var(--primary);
  font-weight: 600;
}

.form-check-custom:has(input:checked) {
  border-color: var(--primary-light);
  background: #e8eaf6;
}

/* === BACK BUTTON === */
.btn-back {
  background: transparent;
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  color: #fff;
  padding: 0.4rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  transition: var(--transition);
}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: #fff;
  color: #fff;
}

/* === EMPTY STATE === */
.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--gray);
}

.empty-state i {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.4;
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .app-header {
    padding: 0.75rem 1rem;
  }
  
  .app-header h1 {
    font-size: 1.1rem;
  }
  
  .main-container {
    padding: 1rem;
  }
  
  .stat-card {
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  
  .stat-card .stat-value {
    font-size: 1.5rem;
  }
  
  .data-table {
    font-size: 0.8rem;
  }
  
  .data-table thead th,
  .data-table tbody td {
    padding: 0.5rem;
  }
  
  .form-section {
    padding: 1rem;
  }
  
  .engineer-select-section {
    margin: 1rem;
    padding: 1.5rem;
  }
  
  .chart-container {
    min-height: 250px;
  }
}

@media (max-width: 576px) {
  .stat-card .stat-value {
    font-size: 1.3rem;
  }
  
  .btn-yakunlash, .btn-rad {
    padding: 0.25rem 0.5rem;
    font-size: 0.7rem;
  }
}

/* === PRINT === */
@media print {
  .app-header, .filter-section, .btn-yakunlash, .btn-rad {
    display: none !important;
  }
  
  .stat-card {
    box-shadow: none;
    border: 1px solid #ddd;
  }
}
</style>
